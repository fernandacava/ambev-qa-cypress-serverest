name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar lint e testes Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          command: npm run lint && npm run test:all

      - name: Gerar relatório HTML
        if: always()
        run: |
          npm run report:merge || true
          npm run report:generate || true

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          if-no-files-found: ignore
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
